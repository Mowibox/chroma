<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 – Chroma</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fff; color: #1d2d35; text-align: center; padding: 1rem; }
    @media (prefers-color-scheme: dark) { body { background: #212529; color: #dee2e6; } }
    h1 { font-size: 4rem; margin: 0; color: #a514e9; }
    a { display: inline-block; margin-top: 1.5rem; padding: .6rem 1.2rem; border-radius: .4rem; background: #a514e9; color: #fff; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p id="msg">Oops! Page not found 'w'</p>
    <a id="home" href="/chroma/en/">Back to Chroma</a>
  </main>
  <script>
    // GitHub Pages serves this single file for every unknown URL: pick the language from the URL, else from the browser.
    var m = location.pathname.match(/^\/chroma\/(fr|en)\//);
    var fr = m ? m[1] === "fr" : /^fr\b/i.test(navigator.language || "");
    // Swap in the full themed 404 page generated by Hugo (layouts/404.html); what is below stays as the fallback.
    fetch("/chroma/" + (fr ? "fr" : "en") + "/404.html")
      .then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (h) { document.open(); document.write(h); document.close(); })
      .catch(function () {});
    if (fr) {
      document.documentElement.lang = "fr";
      document.getElementById("msg").textContent = "Oups ! Page introuvable 'w'";
      var a = document.getElementById("home"); a.textContent = "Retourner sur Chroma"; a.href = "/chroma/fr/";
    }
  </script>
</body>
</html>
